host: 0.0.0.0
port: 8080

server_version: "2.31.3"
asset_version: "1.96.0"
master_data_publish_timestamp: 1784297595
feature_maintenance_flags: "0"
maintenance: false
maintenance_message: ""

# seconds of real time to regenerate 1 stamina
stamina_recovery_seconds: 80

# serve asset bundles from the local assets/ folder (run scripts.download_all_assets
# first) if true, else bundle requests redirect to the official CDN.
# catalogs are always locally served
local_assets: false

# when true, every new/imported account starts with 100000 song tickets (歌劇目録, item
# 130001) so songs can be unlocked freely. songs still have their normal unlock conditions.
grant_music_tickets: false

# base URL the client is told to connect to
# if using mitm_redirect_sirius_to_local and not a domain, keep this as official
# url so https still applies
# official url: https://lb-api.wds-stellarium.com
api_endpoint: http://127.0.0.1:8080

# Cloudflare R2 multi-account storage integration (split assets across free tier accounts)
# Each free Cloudflare account gets 10 GB storage with 0 egress fees.
r2_storage:
  enabled: false
  # mode: "proxy" (stream from R2 to client, 200 OK) or "redirect" (HTTP 302 Found)
  mode: "proxy"
  routes:
    # 1. Map whole category:
    cri: "https://r2-cri.example.com"          # Account 1 (~8 GB)
    2d: "https://r2-2d.example.com"            # Account 2 (~8 GB)

    # 2. Filter per-platform (e.g. separate Android & iOS buckets):
    # "3d:android": "https://r2-3d-android.example.com"
    # "3d:ios": "https://r2-3d-ios.example.com"

    # 3. Filter per-platform and sub-folder prefix:
    # "3d:android:characters": "https://r2-3d-chars.example.com"

    # 4. Filter per category & sub-folder prefix:
    # "3d:theatrecontrollers": "https://r2-3d-b.example.com"
    3d: "https://r2-3d.example.com"            # Account 3 (~9 GB)

    static: "https://r2-static.example.com"    # Account 4 or static assets
    notations: "https://r2-cri.example.com/Notations"

# /api/Environment URLs handed to the client
# NOTE: change all to same endpoint if hosting on a domain (merged assets-e into api server)
master_data_url: https://assets-e.wds-stellarium.com/master-data/production
static_content_url: https://assets-e.wds-stellarium.com/production/static-assets
asset_url: https://assets-e.wds-stellarium.com/production
photo_content_url: https://assets-e.wds-stellarium.com
multi_real_time_server_url: https://lb-realtime.wds-stellarium.com
external_payment_url: https://wds-stellarium.com/game/web-shop

database:
  settings:
    min_size: 3
    max_size: 20
  host: 127.0.0.1
  port: 5432
  database: server_of_dreams
  username: postgres
  password: postgres

jwt_secret: "change-me-in-production"
